controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    camera_tower_controller:
      type: forward_command_controller/ForwardCommandController

    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

    flipper_controller:
      type: forward_command_controller/ForwardCommandController

# ── CP3: 팔 6관절, 궤적 제어 ──
arm_controller:
  ros__parameters:
    joints:
      - arm_joint1
      - arm_joint2
      - arm_joint3
      - arm_joint4
      - arm_joint5      # arm2 시스템 소속이지만 한 컨트롤러로 묶음
      - arm_joint6
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

# ── CP2: 카메라타워 4관절, forward position ──
camera_tower_controller:
  ros__parameters:
    joints:
      - ct_joint1_1
      - ct_joint1_2
      - ct_joint2_1
      - ct_joint2_2
    interface_name: position

# ── CP4: 바퀴, diff_drive (Twist) ──
diff_drive_controller:
  ros__parameters:
    left_wheel_names: ["left_wheel_joint"]
    right_wheel_names: ["right_wheel_joint"]
    wheel_separation: 0.24
    wheel_radius: 0.08
    base_frame_id: base_link

# ── CP4: 플리퍼 4관절, forward position ──
flipper_controller:
  ros__parameters:
    joints:
      - fl_joint
      - fr_joint
      - bl_joint
      - br_joint
    interface_name: position